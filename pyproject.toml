[project]
name = "detect"
version = "0.1.0"
description = "Professional desktop face search application with shared CLI and GUI layers."
requires-python = ">=3.11,<3.12"
dependencies = [
  "PySide6>=6.7,<7.0",
  "insightface>=0.7.3,<0.8",
  "onnxruntime>=1.18,<2.0",
  "faiss-cpu>=1.8,<2.0",
]

[project.optional-dependencies]
# Keep CPU FAISS only on Windows; enable GPU acceleration through ONNX Runtime when needed.
gpu = [
  "onnxruntime-gpu>=1.18,<2.0",
]

[project.scripts]
detect-cli = "detect.interfaces.cli.main:main"
detect-gui = "detect.interfaces.gui.app:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.2,<9.0",
]
build = [
  "nuitka>=2.4,<3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.uv]
default-groups = ["dev"]

[tool.nuitka]
standalone = true
onefile = false
follow-imports = true
